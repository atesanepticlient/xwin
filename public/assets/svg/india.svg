<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="clip">
      <circle cx="256" cy="256" r="256"></circle>
    </clipPath>
  </defs>

  <circle cx="256" cy="256" r="256" fill="#FFFFFF"></circle>

  <g clip-path="url(#clip)">
    <!-- Saffron -->
    <rect x="0" y="0" width="512" height="170.67" fill="#FF9933"></rect>

    <!-- White -->
    <rect x="0" y="170.67" width="512" height="170.66" fill="#FFFFFF"></rect>

    <!-- Green -->
    <rect x="0" y="341.33" width="512" height="170.67" fill="#138808"></rect>

    <!-- Ashoka Chakra -->
    <circle cx="256" cy="256" r="44" fill="none" stroke="#000080" stroke-width="4"></circle>
    <circle cx="256" cy="256" r="3.5" fill="#000080"></circle>

    <!-- 24 Spokes -->
    <g stroke="#000080" stroke-width="2">
      <line x1="256" y1="212" x2="256" y2="300"></line>
      <line x1="256" y1="212" x2="256" y2="300" transform="rotate(15 256 256)"></line>
      <line x1="256" y1="212" x2="256" y2="300" transform="rotate(30 256 256)"></line>
      <line x1="256" y1="212" x2="256" y2="300" transform="rotate(45 256 256)"></line>
      <line x1="256" y1="212" x2="256" y2="300" transform="rotate(60 256 256)"></line>
      <line x1="256" y1="212" x2="256" y2="300" transform="rotate(75 256 256)"></line>
      <line x1="256" y1="212" x2="256" y2="300" transform="rotate(90 256 256)"></line>
      <line x1="256" y1="212" x2="256" y2="300" transform="rotate(105 256 256)"></line>
      <line x1="256" y1="212" x2="256" y2="300" transform="rotate(120 256 256)"></line>
      <line x1="256" y1="212" x2="256" y2="300" transform="rotate(135 256 256)"></line>
      <line x1="256" y1="212" x2="256" y2="300" transform="rotate(150 256 256)"></line>
      <line x1="256" y1="212" x2="256" y2="300" transform="rotate(165 256 256)"></line>
    </g>
  </g>
</svg>